spring:
  application:
    name: belajar-sesi4
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/belajar_sesi4}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    # Matikan open-in-view agar LazyInitializationException & N+1 terlihat saat development
    open-in-view: false
    hibernate:
      # Skema dikelola Flyway, Hibernate hanya memvalidasi
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    display-request-duration: true
  default-produces-media-type: application/json
