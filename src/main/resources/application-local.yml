spring:
  jpa:
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true     # hitung jumlah query per session

logging:
  level:
    org.hibernate.SQL: DEBUG                # cetak SQL
    org.hibernate.orm.jdbc.bind: TRACE      # cetak nilai parameter
    org.hibernate.stat: DEBUG               # ringkasan statistik per session

