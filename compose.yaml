services:
  postgres:
    image: postgres:17-alpine
    container_name: belajar-sesi4-postgres
    environment:
      POSTGRES_DB: belajar_sesi4
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
